name: Android Release
on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (e.g. v1.0.1)
        required: true
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  apk:
    name: Build and publish APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            PKG_TAG="v$(jq -r .version package.json)"
            if git rev-parse -q --verify "refs/tags/$PKG_TAG" > /dev/null; then
              LATEST=$(git tag --list 'v*' --sort=-v:refname | head -n1)
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST:-v0.0.0}"
              TAG="$MAJOR.$MINOR.$((PATCH + 1))"
            else
              TAG="$PKG_TAG"
            fi
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare web dir
        run: |
          mkdir -p dist
          printf '<!doctype html><html><head><meta charset="utf-8"></head><body></body></html>\n' > dist/index.html
      - name: Sync Capacitor
        run: pnpm exec cap sync android
      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 is not set, the APK will not receive push notifications"
            exit 0
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=upload"
            echo "keyPassword=$ANDROID_KEYSTORE_PASSWORD"
          } > android/keystore.properties
      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PappVersionCode=${{ github.run_number }} -PappVersionName=${TAG#v}
      - name: Publish to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="hearth-${TAG#v}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "Hearth ${TAG#v} for Android" --generate-notes
          fi
