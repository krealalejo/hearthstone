pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test

commit-msg:
  commands:
    lint:
      run: |
        msg=$(cat {1})
        if ! echo "$msg" | grep -qE '^(feat|fix|chore|docs|style|refactor|test|perf|ci|build|revert)(\(.+\))?: .{1,72}'; then
          echo "Commit message must follow Conventional Commits: type(scope): subject"
          exit 1
        fi
